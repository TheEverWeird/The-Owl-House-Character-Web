<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Owl House Character Web</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="sidebar-toggle">
    <i class="fa-solid fa-bars"></i>
  </button>
  <button id="theme-toggle">
    <i class="fa-solid fa-sun"></i>
  </button>

  <div id="sidebar">
    <h2>The Owl House Character Web</h2>
    <h3>Characters</h3>
    
    <div class="button-group">
      <button id="btn-select-all">Select All</button>
      <button id="btn-hide-all">Hide All</button>
    </div>

    <div id="toggles"></div>
  </div>

  <div id="character-web"></div>

  <script src="script.js"></script>
</body>
</html>
