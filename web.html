<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Owl House Character Web</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="sidebar-toggle" title="Toggle Sidebar">
    <i class="fa-solid fa-bars"></i>
  </button>
  <button id="reset-view-btn" title="Reset View">
    <i class="fa-solid fa-crosshairs"></i>
  </button>
  <button id="theme-toggle" title="Toggle Theme">
    <i class="fa-solid fa-sun"></i>
  </button>

  <div id="sidebar">
    <h2>The Owl House Character Web</h2>
    
    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="character-search" placeholder="Search character..." />
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <h3>Characters</h3>
    
    <div class="button-group">
      <button id="btn-select-all">Select All</button>
      <button id="btn-hide-all">Hide All</button>
    </div>

    <div id="toggles"></div>
  </div>

  <div id="legend">
    <div id="legend-header">
      <h4 style="margin: 0;">Color Key</h4>
      <i class="fa-solid fa-chevron-up" id="legend-arrow"></i>
    </div>
    <div id="legend-content">
      <div class="legend-row"><span class="color-box" style="background-color: #75fadb;"></span> Main Cast</div>
      <div class="legend-row"><span class="color-box" style="background-color: #fa75ef;"></span> Supporting Cast</div>
      <div class="legend-row"><span class="color-box" style="background-color: #ff5454;"></span> Antagonists / Ancients</div>
      <div class="legend-row"><span class="color-box" style="background-color: #4bd16f;"></span> Outer Realm</div>
    </div>
  </div>

  <div id="character-web"></div>

  <script src="script.js"></script>
</body>
</html>
