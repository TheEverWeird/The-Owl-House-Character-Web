<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Owl House Character Web</title>
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="text/javascript" src="../lib/vis-network.min.js"></script>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <button id="sidebar-toggle" title="Toggle Sidebar">
    <i class="fa-solid fa-bars"></i>
  </button>
  <button id="reset-view-btn" title="Reset View">
    <i class="fa-solid fa-crosshairs"></i>
  </button>
  <button id="theme-toggle" title="Toggle Theme">
    <i class="fa-solid fa-sun"></i>
  </button>
  <!-- NEW: Settings Button -->
  <button id="settings-toggle" title="Open Settings">
    <i class="fa-solid fa-gear"></i>
  </button>

  <!-- NEW: Settings Modal -->
  <div id="settings-modal" class="hidden">
    <div class="settings-content">
      <div class="settings-header">
        <h3>Settings</h3>
        <i class="fa-solid fa-xmark" id="close-settings"></i>
      </div>
      <div class="settings-options">
        <label class="setting-row">
          <span>Enable Physics</span>
          <!-- Unchecked by default -->
          <input type="checkbox" id="toggle-physics">
        </label>
        <label class="setting-row">
          <span>Show Edge Labels</span>
          <!-- Checked by default -->
          <input type="checkbox" id="toggle-edge-labels" checked>
        </label>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <h2>The Owl House Character Web</h2>
    
    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="character-search" placeholder="Search character..." />
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <h3>Characters</h3>
    
    <!-- NEW: Faction & Group Filters -->
    <div id="filter-section">
      <div id="filter-header">
        <h4 style="margin: 0;">Factions & Groups</h4>
        <i class="fa-solid fa-chevron-down" id="filter-arrow"></i>
      </div>
      <div id="filter-content" class="collapsed">
        <h5>Covens</h5>
        <div id="coven-buttons" class="grid-3"></div>
        <h5>Groups</h5>
        <div id="group-buttons" class="grid-2"></div>
      </div>
    </div>

    <div class="button-group">
      <button id="btn-select-all">Select All</button>
      <button id="btn-hide-all">Hide All</button>
    </div>
    <button id="btn-reset-filters">Reset Filters</button>

    <div id="toggles"></div>
  </div>

  <div id="legend">
    <div id="legend-header">
      <h4 style="margin: 0;">Color Key</h4>
      <i class="fa-solid fa-chevron-up" id="legend-arrow"></i>
    </div>
    <div id="legend-content">
      <div class="legend-row"><span class="color-box" style="background-color: #75fadb;"></span> Main Characters</div>
      <div class="legend-row"><span class="color-box" style="background-color: #fa75ef;"></span> Main Side Characters</div>
      <div class="legend-row"><span class="color-box" style="background-color: #ff5454;"></span> Supporting Side Characters</div>
      <div class="legend-row"><span class="color-box" style="background-color: #4bd16f;"></span> Minor Side/Background Characters</div>
    </div>
  </div>

  <div id="character-web"></div>
  <script src="./data/nodes.js"></script>
  <script src="script.js"></script>
</body>
</html>
